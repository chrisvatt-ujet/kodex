[project]
name = "kodex"
version = "0.1.0"
description = "Profile-aware Codex and Claude Code CLI wrappers"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "pyright",
    "ruff",
]

[project.scripts]
kodex = "kodex.cli:main"
clod = "kodex.claude:main"
klodex = "kodex.claude:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/kodex"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.14"
typeCheckingMode = "strict"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "UP"]
